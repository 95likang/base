# base 应用站点：占用 80 端口根路径
#
# 拓扑：
#   浏览器 → nginx:80 → (SSR 页面) client:3101 → (rewrite /api) api:3100
#   admin 静态产物由 nginx 直接托管在 /admin/
#
# 注意：
# - /api/ 必须 proxy_buffering off：对话是 SSE 流，缓冲会让整段回复攒到最后才出现。
# - client_max_body_size 放宽到 60m：图片以 base64 塞在 POST /api/chat 的 JSON 里
#   （前端上限 8 张 × 15MB 原始文件，降采样后仍可能较大）。
# - 原 frontend.conf 已被 scripts/deploy 备份到 /root/backup-*，回滚见 README。

upstream base_client {
    server 127.0.0.1:3101;
    keepalive 32;
}

server {
    listen 80;
    server_name 175.178.198.182;

    # 覆盖旧的「坚强莓」站点；旧文件已备份，此处不再引用 /var/www/frontend
    root /var/www/base-admin;
    index index.html;

    client_max_body_size 60m;

    # SSE 流式响应：关掉一切缓冲与压缩
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # admin 后台：静态 SPA
    location ^~ /admin/ {
        alias /var/www/base-admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 主应用（Next.js SSR）
    location / {
        proxy_pass http://base_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Next 用 X-Forwarded-Host 生成绝对地址（middleware 的 new URL('/login', request.url)）；
        # 不传的话 location 跳转会变成 http://localhost:3101/login，把内部端口暴露给浏览器
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Next 的 RSC 流式渲染同样不能被缓冲
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
